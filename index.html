<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>RANBIDGE SOLUTIONS | Virtual Internship & Career Portal</title>
  <link rel="icon" href="https://ik.imagekit.io/lg14qfjkg/COMPANY%20STAMP.jpeg" type="image/x-icon">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    
    :root {
      --primary: #6366f1;
      --secondary: #8b5cf6;
    }


    body {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      background-color: #f8fafc;
      scroll-behavior: smooth;
      overflow-x: hidden;
    }

    /* Hide scrollbar utility */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    ::-webkit-scrollbar {
      width: 0px;
      height: 0px;
      display: none;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    html, body, div {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }

    /* Dropdown Scrollbar Utility */
    .dropdown-scrollable {
      -ms-overflow-style: auto !important;
      scrollbar-width: thin !important;
      scrollbar-color: rgba(99, 102, 241, 0.4) transparent !important;
    }
    .dropdown-scrollable::-webkit-scrollbar {
      width: 5px !important;
      height: 5px !important;
      display: block !important;
    }
    .dropdown-scrollable::-webkit-scrollbar-track {
      background: rgba(241, 245, 249, 0.6) !important;
      border-radius: 8px !important;
    }
    .dropdown-scrollable::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.6) !important;
      border-radius: 8px !important;
    }
    .dropdown-scrollable::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.9) !important;
    }

    /* Ambient Animated Mesh Background */
    .bg-mesh-pattern {
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.04) 0%, transparent 60%);
    }

    /* Custom Selection Color */
    ::selection {
      background: rgba(99, 102, 241, 0.25);
      color: #4338ca;
    }

    /* Keyframe Animations */
    @keyframes float-slow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1.5deg); }
    }

    @keyframes float-reverse {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(12px) rotate(-1.5deg); }
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 0.95; transform: scale(1.05); }
    }

    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }

    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes fade-in-up {
      0% {
        opacity: 0;
        transform: translateY(24px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fade-in {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes scale-up {
      0% {
        opacity: 0;
        transform: scale(0.96);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes dropdown-fade {
      0% {
        opacity: 0;
        transform: translateY(-8px) scale(0.95);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes mobile-bounce-subtle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    @keyframes card-tap-pulse {
      0% { transform: scale(1); }
      50% { transform: scale(0.97); }
      100% { transform: scale(1); }
    }

    @keyframes shine-sweep {
      0% { transform: translateX(-100%) rotate(25deg); }
      100% { transform: translateX(200%) rotate(25deg); }
    }

    @keyframes spring-pop {
      0% { transform: scale(0.85); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.6); }
      70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(99, 102, 241, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
    }

    @keyframes mobile-dock-glow {
      0%, 100% { box-shadow: 0 10px 35px -5px rgba(99, 102, 241, 0.45), 0 0 20px rgba(139, 92, 246, 0.35); }
      50% { box-shadow: 0 16px 45px -2px rgba(99, 102, 241, 0.7), 0 0 30px rgba(236, 72, 153, 0.5); }
    }

    /* Utility Classes for Animations */
    .animate-spring-pop {
      animation: spring-pop 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .animate-mobile-bounce {
      animation: mobile-bounce-subtle 2s ease-in-out infinite;
    }

    .animate-pulse-ring {
      animation: pulse-ring 2.5s infinite;
    }

    .animate-dock-glow {
      animation: mobile-dock-glow 3.5s ease-in-out infinite;
    }

    .animate-float-slow {
      animation: float-slow 5s ease-in-out infinite;
    }

    .animate-float-reverse {
      animation: float-reverse 6s ease-in-out infinite;
    }

    .animate-pulse-glow {
      animation: pulse-glow 3s ease-in-out infinite;
    }

    .animate-marquee {
      display: flex;
      width: 200%;
      animation: marquee 25s linear infinite;
    }

    .animate-marquee:hover {
      animation-play-state: paused;
    }

    .animated-gradient-text {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 35%, #ec4899 70%, #4f46e5 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradient-shift 6s ease infinite;
    }

    .animate-fade-in-up {
      animation: fade-in-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-fade-in {
      animation: fade-in 0.4s ease-out forwards;
    }

    .animate-scale-up {
      animation: scale-up 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-dropdown-fade {
      animation: dropdown-fade 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Glassmorphism Cards */
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(241, 245, 249, 0.8);
    }

    /* Card Hover Shimmer Effect */
    .shimmer-card {
      position: relative;
      overflow: hidden;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.35s ease;
    }

    .shimmer-card::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        60deg,
        transparent 30%,
        rgba(255, 255, 255, 0.25) 50%,
        transparent 70%
      );
      transform: translateX(-100%) rotate(25deg);
      transition: transform 0.8s ease;
      pointer-events: none;
    }

    .shimmer-card:hover::after {
      transform: translateX(100%) rotate(25deg);
    }

    /* Global Micro-interactions */
    button, a {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
      "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
      "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
      "react/": "https://esm.sh/react@^19.2.3/",
      "react": "https://esm.sh/react@^19.2.3"
    }
  }
  </script>
</head>
<body class="bg-mesh-pattern text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-700">
  <div id="root"></div>
  <script type="module" src="index.tsx"></script>
</body>
</html>

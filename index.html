<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RANBIDGE SOLUTIONS | Virtual Internship & Career Portal</title>
  <link rel="icon" href="https://ik.imagekit.io/lg14qfjkg/COMPANY%20STAMP.jpeg" type="image/x-icon">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    
    :root {
      --primary: #6366f1;
      --secondary: #8b5cf6;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      background-color: #f8fafc;
      scroll-behavior: smooth;
      overflow-x: hidden;
    }

    /* Ambient Animated Mesh Background */
    .bg-mesh-pattern {
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.04) 0%, transparent 60%);
    }

    /* Custom Selection Color */
    ::selection {
      background: rgba(99, 102, 241, 0.25);
      color: #4338ca;
    }

    /* Keyframe Animations */
    @keyframes float-slow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1.5deg); }
    }

    @keyframes float-reverse {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(12px) rotate(-1.5deg); }
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 0.95; transform: scale(1.05); }
    }

    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }

    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Utility Classes for Animations */
    .animate-float-slow {
      animation: float-slow 5s ease-in-out infinite;
    }

    .animate-float-reverse {
      animation: float-reverse 6s ease-in-out infinite;
    }

    .animate-pulse-glow {
      animation: pulse-glow 3s ease-in-out infinite;
    }

    .animate-marquee {
      display: flex;
      width: 200%;
      animation: marquee 25s linear infinite;
    }

    .animate-marquee:hover {
      animation-play-state: paused;
    }

    .animated-gradient-text {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 35%, #ec4899 70%, #4f46e5 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradient-shift 6s ease infinite;
    }

    /* Glassmorphism Cards */
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(241, 245, 249, 0.8);
    }

    /* Card Hover Shimmer Effect */
    .shimmer-card {
      position: relative;
      overflow: hidden;
    }

    .shimmer-card::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        60deg,
        transparent 30%,
        rgba(255, 255, 255, 0.25) 50%,
        transparent 70%
      );
      transform: translateX(-100%) rotate(25deg);
      transition: transform 0.8s ease;
      pointer-events: none;
    }

    .shimmer-card:hover::after {
      transform: translateX(100%) rotate(25deg);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
      "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
      "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
      "react/": "https://esm.sh/react@^19.2.3/",
      "react": "https://esm.sh/react@^19.2.3"
    }
  }
  </script>
</head>
<body class="bg-mesh-pattern text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-700">
  <div id="root"></div>
  <script type="module" src="index.tsx"></script>
</body>
</html>
